          "Backoffice",
          "Platform"
        ],
        "security": [
          {
            "bearer_auth": []
          }
        ],
        "parameters": [
          {
            "name": "Authorization",
            "in": "header",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "backoffice reads operational alerts",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data"
                  ],
                  "properties": {
                    "data": {
                      "type": "object",
                      "required": [
                        "credentials_expiring",
                        "schools_with_disabled_modules",
                        "provisioning_backlog_count"
                      ],
                      "properties": {
                        "credentials_expiring": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "required": [
                              "school_id",
                              "school_name",
                              "certificate_expires_at",
                              "days_remaining"
                            ],
                            "properties": {
                              "school_id": {
                                "type": "integer"
                              },
                              "school_name": {
                                "type": "string"
                              },
                              "certificate_expires_at": {
                                "type": "string",
                                "format": "date-time"
                              },
                              "days_remaining": {
                                "type": "integer"
                              }
                            }
                          }
                        },
                        "schools_with_disabled_modules": {
                          "type": "array",
                          "items": {
                            "type": "object",
                            "required": [
                              "school_id",
                              "school_name",
                              "disabled_modules"
