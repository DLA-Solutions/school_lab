    "/api/v1/platform/audits": {
      "get": {
        "summary": "List platform audits",
        "tags": [
          "Backoffice",
          "Platform Audits"
        ],
        "security": [
          {
            "bearer_auth": []
          }
        ],
        "parameters": [
          {
            "name": "Authorization",
            "in": "header",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "school_id",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer"
            }
          },
          {
            "name": "action",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "date_from",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "date_to",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "audited_changes redact guardian email values",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "data",
                    "meta"
                  ],
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "required": [
                          "id",
                          "action",
                          "auditable_type",
                          "created_at",
                          "changed_keys",
                          "audited_changes"
                        ],
                        "properties": {
                          "id": {
                            "type": "integer"
                          },
                          "action": {
                            "type": "string"
                          },
                          "auditable_type": {
                            "type": "string"
                          },
                          "auditable_id": {
                            "type": "integer",
                            "nullable": true
                          },
                          "school_id": {
                            "type": "integer",
                            "nullable": true
                          },
                          "created_at": {
                            "type": "string",
                            "format": "date-time"
                          },
                          "changed_keys": {
                            "type": "array",
                            "items": {
                              "type": "string"
                            }
                          },
                          "audited_changes": {
                            "type": "object"
                          },
                          "actor": {
                            "type": "object",
                            "nullable": true,
                            "properties": {
                              "id": {
                                "type": "integer"
                              },
                              "type": {
                                "type": "string"
                              }
                            }
                          },
                          "comment": {
                            "type": "string",
                            "nullable": true
                          }
                        }
                      }
                    },
                    "meta": {
                      "type": "object",
                      "required": [
                        "page",
                        "per_page",
                        "total"
                      ],
                      "properties": {
                        "page": {
                          "type": "integer"
                        },
                        "per_page": {
                          "type": "integer"
                        },
                        "total": {
                          "type": "integer"
                        }
                      }
                    }
                  }
                }
              }
            }
          },
          "422": {
            "description": "invalid date_from"
          },
          "403": {
            "description": "staff without backoffice role"
          }
        }
      }
    },
