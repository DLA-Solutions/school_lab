# Base Kamal configuration, shared by both destinations.
# Always deploy with an explicit destination: `kamal deploy -d production|staging`.
# Runbook: docs/guidelines/process/deployment.md

service: scholarpremium

image: dla-solutions/scholarpremium

# Refuse to run without -d, so a bare `kamal deploy` can never hit production.
require_destination: true

servers:
  web:
    - 77.42.33.33

registry:
  server: ghcr.io
  username: SEU_USUARIO_GITHUB
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy

builder:
  arch: amd64
  cache:
    type: registry
  # Building amd64 on an arm64 Mac falls back to QEMU emulation, which makes native
  # gem compilation (pg, bootsnap) take many minutes. The app server is already amd64.
  # remote: ssh://deploy@77.42.33.33

proxy:
  ssl: true
  app_port: 80
  healthcheck:
    path: /up
    interval: 3
    timeout: 60

env:
  clear:
    SOLID_QUEUE_IN_PUMA: true
    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 3
    JOB_CONCURRENCY: 1
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - CABLE_DATABASE_URL
    - REDIS_URL

# Bridge fingerprinted assets between versions so in-flight requests don't 404.
asset_path: /rails/public/assets

deploy_timeout: 60

# PostgreSQL and Redis run natively on the database VPS and are not managed by Kamal,
# so there are no accessories here.

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
