# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  billing_monthly_charge_generation:
    class: Billing::MonthlyChargeGenerationJob
    queue: billing
    # Fugit only parses "on the 1st of every month" phrasing as a one-off point in time
    # (EtOrbi::EoTime), not a recurring Fugit::Cron — Solid Queue rejects it as unsupported.
    # This phrasing parses as a cron and passes SolidQueue::RecurringTask#ensure_schedule_supported.
    schedule: every month on the 1st at 6am
    timezone: America/Sao_Paulo
  billing_daily_reconciliation:
    class: Billing::DailyReconciliationJob
    queue: billing
    schedule: at 6am every day
    timezone: America/Sao_Paulo
  billing_mark_overdue_charges:
    class: Billing::MarkOverdueChargesJob
    queue: billing
    schedule: at 6:30am every day
    timezone: America/Sao_Paulo
  billing_monitor_health:
    class: Billing::MonitorBillingHealthJob
    queue: billing
    schedule: at 7am every day
    timezone: America/Sao_Paulo
  billing_purge_webhook_events:
    class: Billing::PurgeWebhookEventsJob
    queue: billing
    schedule: at 5:30am every day
    timezone: America/Sao_Paulo

development:
  billing_monthly_charge_generation:
    class: Billing::MonthlyChargeGenerationJob
    queue: billing
    schedule: every month on the 1st at 6am
