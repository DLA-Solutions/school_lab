# PostgreSQL (Docker Compose at repo root — see ../../README.md).
#
# Copy .env.example to .env and adjust if needed.
# Defaults match docker-compose.yml credentials.

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "school_lab") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "school_lab") %>

development:
  <<: *default
  database: school_lab_development

test:
  <<: *default
  database: school_lab_test

# Connection details come from Kamal secrets (see docs/guidelines/process/deployment.md).
# Solid Queue and Solid Cache share the primary database on purpose; only Solid Cable
# is separate, because its writes are high-volume and disposable.
production:
  primary: &primary_production
    adapter: postgresql
    encoding: unicode
    # Solid Queue has no connects_to (see config/environments/production.rb) — it shares this
    # pool with Puma's web threads. RAILS_MAX_THREADS covers the web threads; +5 covers Solid
    # Queue's own need (config/queue.yml workers.threads=3, +2 reserved for polling/heartbeat
    # per SolidQueue::Configuration#estimated_number_of_threads), all running in-process
    # (SOLID_QUEUE_IN_PUMA). Bump the "+5" if queue.yml's worker threads ever change.
    max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + 5 %>
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    schema_dump: false
  queue:
    <<: *primary_production
    schema_dump: false
  cable:
    <<: *primary_production
    url: <%= ENV["CABLE_DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
