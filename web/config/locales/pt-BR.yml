# O produto fala dois idiomas, e este é o padrão. `en.yml` é o par: as duas chaves têm de existir
# nos dois arquivos, senão um usuário em inglês recebe uma frase em português no meio da tela — e
# `config/initializers/locale.rb` não define fallback justamente para que essa falta apareça no
# desenvolvimento em vez de chegar ao cliente.
#
# Qual idioma responde a cada requisição vem do `Accept-Language`, resolvido em
# `Api::V1::BaseController`.
pt-BR:
  billing:
    settings:
      default_service_description: "Mensalidade escolar"
  api:
    errors:
      unauthorized: "Não autorizado."
      invalid_credentials: "E-mail ou senha inválidos."
      invalid_invite_token: "Este convite é inválido ou expirou."
      forbidden: "Acesso negado."
      not_found: "Não encontrado."
      not_implemented: "Recurso ainda não implementado."
      validation_error: "Dados inválidos."
      invalid_state_transition: "Transição de estado inválida."
      provider_error: "Falha na comunicação com o provedor de pagamento."
      billing_interest_rate_missing: "Configure a taxa de mora nas configurações de cobrança antes de emitir boletos."
      membership_suspended: "Acesso suspenso nesta escola."
      membership_invited: "Convite pendente para esta escola."
      student_requires_a_guardian: "Informe o CPF do pai ou da mãe."
      guardian_cpf_not_found: "Nenhum responsável cadastrado com o CPF %{cpf}. Cadastre-o antes de matricular o estudante."
      duplicate_guardian_cpf: "O mesmo CPF foi informado para pai e mãe."
      contract_without_guardians: "Este contrato não tem responsável vinculado ao aluno. Vincule ao menos um antes de enviar para assinatura."
      contract_pdf_unsupported_characters: "O contrato contém caracteres que a fonte do PDF não suporta. Fale com o suporte."
      contract_template_missing: "Nenhum modelo de contrato configurado para esta escola."
      contract_already_sent: "Este contrato já foi enviado para assinatura."
      contract_not_sent: "Este contrato ainda não foi enviado para assinatura."
      signer_missing_details: "Sem e-mail ou CPF para %{names}. Complete o cadastro antes de enviar."
      signature_provider_missing: "Nenhuma integração de assinatura configurada para esta escola."
      signature_provider_unauthorized: "A Autentique recusou as credenciais desta escola."
      signature_provider_unavailable: "A Autentique está indisponível no momento. Tente novamente em instantes."
      charge_without_payer: "Informe o responsável financeiro que receberá o boleto."
      charge_batch_no_contracts: "Selecione ao menos um contrato para gerar os boletos."
      charge_batch_invalid_period: "Informe uma competência válida, no formato AAAA-MM."
      charge_amount_required: "Informe um valor maior que zero."
      charge_due_date_required: "Informe a data de vencimento."
      plan_discount_in_use: "Este desconto está aplicado em %{count} contrato(s) e não pode ser removido."
      cannot_delete_system_template: "Modelos do sistema não podem ser excluídos."
      template_in_use: "Este modelo está em uso por %{count} colaborador(es)."
      last_admin_template: "A escola precisa manter ao menos um modelo com permissões de administrador."
      job_position_in_use: "Este cargo está em uso por %{count} colaborador(es). Altere o cargo deles antes de removê-lo."
      invalid_permission_for_role: "Esta permissão não é permitida para o papel deste membro."
    # Não impedem o envio — o contrato sai com uma lacuna que alguém terá de preencher depois.
    warnings:
      student_without_cpf: "Este aluno não tem CPF cadastrado; o contrato sairá com esse campo em branco."
      student_without_class: "Este aluno não está em nenhuma turma; o contrato sairá sem a turma."
      contract_template_missing: "Esta escola não tem modelo de contrato próprio. Será usado o modelo padrão, sem as cláusulas da escola."
  signature:
    contract_message: "Segue o contrato de prestação de serviços educacionais referente a %{student}. Confira os dados e assine."
  # Respostas `validation_error` carregam as mensagens do ActiveModel em `details`, e a SPA as
  # imprime sob cada campo — então são textos para o usuário, não saída para quem desenvolve.
  errors:
    messages:
      blank: "não pode ficar em branco"
      invalid: "não é válido"
      taken: "já está em uso"
      inclusion: "não está na lista de valores permitidos"
      not_a_number: "não é um número"
      greater_than_or_equal_to: "deve ser maior ou igual a %{count}"
      less_than_or_equal_to: "deve ser menor ou igual a %{count}"
  activerecord:
    errors:
      messages:
        invalid_cpf: "não é um CPF válido"
        must_be_in_the_past: "deve estar no passado"
        must_not_be_in_the_future: "não pode estar no futuro"
      models:
        guardian:
          attributes:
            cpf:
              taken: "já cadastrado para outro responsável nesta escola"
    attributes:
      contract_template:
        logo: "Logo"
        body_html: "Corpo do contrato"
      teacher:
        name: "Nome"
        cpf: "CPF"
        email: "E-mail"
        phone: "Telefone"
        job_position: "Cargo"
        hired_on: "Início da contratação"
      guardian:
        name: "Nome"
        cpf: "CPF"
        email: "E-mail"
        phone: "Telefone"
        zip_code: "CEP"
        street: "Logradouro"
        number: "Número"
        complement: "Complemento"
        neighborhood: "Bairro"
        city: "Cidade"
        state: "UF"
