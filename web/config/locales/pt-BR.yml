# O produto fala dois idiomas, e este é o padrão. `en.yml` é o par: as duas chaves têm de existir
# nos dois arquivos, senão um usuário em inglês recebe uma frase em português no meio da tela — e
# `config/initializers/locale.rb` não define fallback justamente para que essa falta apareça no
# desenvolvimento em vez de chegar ao cliente.
#
# Qual idioma responde a cada requisição vem do `Accept-Language`, resolvido em
# `Api::V1::BaseController`.
