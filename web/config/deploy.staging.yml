# Staging runs with RAILS_ENV=production against Cora sandbox credentials.
proxy:
  hosts:
    - staging.scholarpremium.com.br
  path_prefixes:
    - /api
    - /up
    - /api-docs
    - /webhooks
  strip_path_prefix: false

env:
  clear:
    CORA_API_BASE_URL: https://matls-clients.api.stage.cora.com.br
    CORA_TOKEN_URL: https://matls-clients.api.stage.cora.com.br/token
    INTER_API_BASE_URL: https://cdpj-sandbox.partners.uatinter.co
    INTER_TOKEN_URL: https://cdpj-sandbox.partners.uatinter.co/oauth/v2/token
    CORS_ORIGINS: https://staging.scholarpremium.com.br
    APP_HOST: staging.scholarpremium.com.br
    WEB_CONCURRENCY: 1
    EXPOSE_API_DOCS: "true"
    SEED_DEMO_DATA: "true"
    SEED_SCHOOL_NAME: "Colégio Demo Staging"
    MARKETING_DEMO_REQUEST_RECIPIENTS: contato@diegonovais.com.br,luizcalaca@gmail.com
  # Kamal deep_merge replaces arrays — repeat base secrets from deploy.yml, not only staging extras.
  secret:
    - RAILS_MASTER_KEY
    - JWT_SECRET_KEY
    - DATABASE_URL
    - CABLE_DATABASE_URL
    - REDIS_URL
    - POSTMARK_API_TOKEN
    - GOOGLE_OAUTH_CLIENT_ID
    - API_DOCS_USERNAME
    - API_DOCS_PASSWORD

# Separate volume so staging uploads never land in the production Active Storage tree.
volumes:
  - "scholarpremium_staging_storage:/rails/storage"
