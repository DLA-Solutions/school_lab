  Assinatura de e-mail — Scholar Premium
  Como usar:
  1) Exporte o "Conceito A — lockup horizontal (light)" gerado na conversa como PNG, hospede-o

     e troque o SRC_DA_LOGO_AQUI abaixo por essa URL.
  2) Troque os campos NOME, CARGO, TELEFONE e E-MAIL pelos dados da pessoa.
  3) Cole o HTML renderizado (não o código) no editor de assinatura do Gmail/Outlook.
     A maioria dos clientes de e-mail ignora <style> em bloco — por isso os estilos abaixo
     estão inline, célula por célula, propositalmente.
-->
