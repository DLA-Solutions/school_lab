# Local development for School Lab (monorepo root).
#
# Infrastructure only (host Rails):
#   cp web/.env.example web/.env
#   make services-up
#
# Full stack in Docker (API + Postgres + Redis):
#   cp web/.env.example web/.env
#   make setup && make up

name: school_lab

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: school_lab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school_lab}
      POSTGRES_DB: ${POSTGRES_DB:-school_lab_development}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U school_lab -d school_lab_development" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: school_lab_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    profiles: [ "app" ]
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: school_lab_web
    env_file:
      - web/.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: development
      PORT: "3000"
      RUBY_DEBUG_OPEN: "true"
      RUBY_DEBUG_LAZY: "true"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./web:/rails
      - bundle_cache:/usr/local/bundle
      - rails_tmp:/rails/tmp
      - rails_log:/rails/log
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:
  bundle_cache:
  rails_tmp:
  rails_log:
