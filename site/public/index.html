<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Scholar Premium — plataforma de gestão escolar para escolas particulares brasileiras. Em breve."
    />
    <title>Scholar Premium — Em breve</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#182641" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <div class="glow" aria-hidden="true"></div>
      <header class="brand">
        <!-- Landing is always a dark surface; use the white mark regardless of OS scheme. -->
        <img
          src="/brand-icon-dark.png"
          alt="Scholar Premium"
          width="40"
          height="40"
          class="brand__icon"
        />
        <span class="brand__name">Scholar Premium</span>
      </header>
      <h1 class="headline">Em breve</h1>
      <p class="lead">
        Estamos preparando a plataforma de gestão escolar para escolas particulares brasileiras.
      </p>
      <a class="cta" href="/app/authentication/signin">Acessar plataforma</a>
      <footer class="footer">
        <p>School Lab &middot; Scholar Premium</p>
      </footer>
    </main>
  </body>
</html>
