<!-- Postmark preheader: Nova solicitação de demonstração pelo site -->
<h1 style="margin: 0 0 16px; font-size: 22px; font-weight: 600; color: #082366; line-height: 1.3;">
  Demonstração solicitada
</h1>

<p style="margin: 0 0 16px; color: #171923;">
  Olá,
</p>

<p style="margin: 0 0 24px; color: #4A5568;">
  Alguém pediu uma demonstração pelo site do Scholar Premium.
</p>

<table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="border: 1px solid #D9E1FA; border-radius: 8px; overflow: hidden;">
  <tr>
    <td style="padding: 12px 16px; background-color: #F7FAFC; border-bottom: 1px solid #D9E1FA; width: 140px; color: #7E89AC; font-size: 13px; font-weight: 600;">
      Nome
    </td>
    <td style="padding: 12px 16px; background-color: #FFFFFF; border-bottom: 1px solid #D9E1FA; color: #171923; font-size: 15px;">
      {{name}}
    </td>
  </tr>
  <tr>
    <td style="padding: 12px 16px; background-color: #F7FAFC; border-bottom: 1px solid #D9E1FA; color: #7E89AC; font-size: 13px; font-weight: 600;">
      E-mail
    </td>
    <td style="padding: 12px 16px; background-color: #FFFFFF; border-bottom: 1px solid #D9E1FA; color: #171923; font-size: 15px;">
      <a href="mailto:{{email}}" style="color: #082366; text-decoration: none;">{{email}}</a>
    </td>
  </tr>
  <tr>
    <td style="padding: 12px 16px; background-color: #F7FAFC; border-bottom: 1px solid #D9E1FA; color: #7E89AC; font-size: 13px; font-weight: 600;">
      Telefone (WhatsApp)
    </td>
    <td style="padding: 12px 16px; background-color: #FFFFFF; border-bottom: 1px solid #D9E1FA; color: #171923; font-size: 15px;">
      {{phone}}
    </td>
  </tr>
  <tr>
    <td style="padding: 12px 16px; background-color: #F7FAFC; color: #7E89AC; font-size: 13px; font-weight: 600;">
      Enviado em
    </td>
    <td style="padding: 12px 16px; background-color: #FFFFFF; color: #171923; font-size: 15px;">
      {{submitted_at}}
    </td>
  </tr>
</table>

<p style="margin: 24px 0 0; color: #7E89AC; font-size: 13px;">
  Origem: site de marketing Scholar Premium
</p>
