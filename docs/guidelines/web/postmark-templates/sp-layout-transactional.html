<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{subject}}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style>
    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; }
      .content-cell { padding: 24px 20px !important; }
      .header-cell { padding: 20px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #F7FAFC; font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">
  <!-- Preheader (hidden) -->
  <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all;">
    {{preheader}}&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
  </div>

  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #F7FAFC;">
    <tr>
      <td align="center" style="padding: 32px 16px;">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="600" class="email-container" style="max-width: 600px; width: 100%;">

          <!-- Header -->
          <tr>
            <td class="header-cell" align="center" style="background-color: #FFFFFF; border: 1px solid #D9E1FA; border-bottom: none; border-radius: 12px 12px 0 0; padding: 28px 32px;">
              <img src="https://scholarpremium.com.br/assets/brand/logo_lockup.png" alt="Scholar Premium" width="180" style="display: block; max-width: 180px; height: auto; border: 0;">
            </td>
          </tr>

          <!-- Content card -->
          <tr>
            <td class="content-cell" style="background-color: #FFFFFF; border-left: 1px solid #D9E1FA; border-right: 1px solid #D9E1FA; padding: 32px 40px; color: #171923; font-size: 16px; line-height: 1.6;">
              {{{ @content }}}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background-color: #FFFFFF; border: 1px solid #D9E1FA; border-top: none; border-radius: 0 0 12px 12px; padding: 24px 40px 32px;">
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%">
                <tr>
                  <td align="center" style="color: #7E89AC; font-size: 13px; line-height: 1.5;">
                    <p style="margin: 0 0 8px;">Scholar Premium — gestão escolar para escolas particulares</p>
                    <p style="margin: 0;">
                      <a href="https://scholarpremium.com.br" style="color: #082366; text-decoration: none;">scholarpremium.com.br</a>
                    </p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Legal line -->
          <tr>
            <td align="center" style="padding: 20px 16px 0; color: #7E89AC; font-size: 12px; line-height: 1.4;">
              Você recebeu este e-mail porque há uma ação pendente na sua conta Scholar Premium.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
